repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
    -   id: check-yaml
    -   id: sort-simple-yaml
    -   id: check-added-large-files
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.1
    hooks:
    -   id: mypy
        files: ^src/.*\.py$
        args: [--strict]
        additional_dependencies: [
            numpy>=2.4.6,
            sentence-transformers>=5.5.1,
            torch>=2.12.0
        ]
-   repo: local
    hooks:
    # run tests
    -   id: local-tests
        name: tests
        language: python
        entry: make test
        pass_filenames: false
